<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#1C1B19"/>
  <!-- 3D Brick isometric isometric top -->
  <polygon points="32,12 52,22 32,32 12,22" fill="#D34B32" stroke="#E65D44" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Front Left Face -->
  <polygon points="12,22 32,32 32,50 12,40" fill="#982D1B" stroke="#7A2214" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Front Right Face -->
  <polygon points="32,32 52,22 52,40 32,50" fill="#B23A24" stroke="#8E2A18" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Brick indentation (frog) on top -->
  <polygon points="32,18 42,23 32,28 22,23" fill="#B23A24" opacity="0.6"/>
  <!-- Gold corner accent dot -->
  <circle cx="32" cy="32" r="2.5" fill="#F5B800"/>
</svg>
